name: Apply exact order filter

on:
  push:
    paths:
      - .github/workflows/apply-exact-order-filter.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix exact workflow filtering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/admin/orders/page.tsx')
          text = path.read_text()

          old = 'if (statusFilter !== "all" && order.status !== statusFilter) return false;'
          new = 'if (statusFilter !== "all" && workflowStatus(order) !== statusFilter) return false;'

          if old not in text:
              raise SystemExit('Expected old order filter was not found')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/orders/page.tsx
          git commit -m "Fix exact order workflow filtering"
          git push

# trigger: 2
