name: Rename contacted status label

on:
  push:
    paths:
      - .github/workflows/rename-contacted-status-label.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename label in orders page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/admin/orders/page.tsx')
          text = path.read_text()
          old = '{ value: "contacted", label: "تم التواصل" },'
          new = '{ value: "contacted", label: "تم التواصل لتأكيد الطلب" },'
          if old not in text:
              raise SystemExit('Old contacted label not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/orders/page.tsx
          git commit -m "Rename contacted status label"
          git push